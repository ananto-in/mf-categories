name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data-and-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint:words
      - run: npm test

  # php: added together with the PHP package (composer install, phpunit, phpcs --standard=PSR12 src/php)
